# RabbitMQ server config.
#
# Worker consumers (worker-material, worker-ai) block their pika connection
# thread for the ENTIRE job: an AI generation call plus its validation retries
# can run for minutes. With the stock 60s heartbeat, RabbitMQ kills the
# connection the moment one of those long jobs exceeds it, the unacked message
# is requeued, and the SAME job re-runs in a loop — batches then take far
# longer than the web's poll window and look stuck. Raise the negotiated
# timeout here AND on the workers (they request the same value via
# `?heartbeat=1800` in WORKER_RABBITMQ_URL); the negotiation picks the
# smaller of the two, so both must agree.
heartbeat = 1800