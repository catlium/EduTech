# ─────────────────────────────────────────────────────────────
# CatLium EduTech - Nginx application reverse proxy
# ─────────────────────────────────────────────────────────────
# The ONLY application-facing reverse proxy. Cloudflare Tunnel
# (cloudflared) connects to this server on http://nginx:80 and
# forwards every public request here; nginx then routes:
#
#   /     -> http://web:3001   (Next.js app)
#   /api/ -> http://api:3000   (NestJS API, /api/v1 prefix preserved)
#
# Nginx itself binds only inside the private Docker network — it
# publishes NO host port and is never reachable from the internet.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile          on;
    keepalive_timeout 65;

    # Docker's embedded DNS. Resolving upstreams at request time (via the
    # variables below) keeps nginx correct when api/web are recreated and
    # get a new container IP — a static proxy_pass would pin the old IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Map the Connection header for WebSocket/SSE upgrades.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # Largest body we serve is material uploads (API limit 20MB);
        # allow slack for multipart overhead.
        client_max_body_size 26m;

        # Application payloads are moderate; allow slow clients/AI jobs.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Simple liveness endpoint handled directly by nginx (used by the
        # compose healthcheck + the tunnel's depends_on).
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }

        # NestJS API at http://api:3000 — pass the FULL path through so the
        # global /api/v1 prefix (and the /api/v1/auth cookie scope) is kept.
        location /api/ {
            set $api_upstream http://api:3000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
        }

        # Everything else -> Next.js web app on :3001.
        location / {
            set $web_upstream http://web:3001;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
        }
    }
}