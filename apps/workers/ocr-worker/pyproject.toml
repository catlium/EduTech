[project]
name = "catlium-ocr-worker"
version = "0.0.1"
description = "CatLium EduTech - Distributed OCR Worker (pull client)"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.9.0",
    "httpx>=0.28.0",
    "catlium-ocr>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.11.0",
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
]

[project.scripts]
ocr-worker = "ocr_worker.app:run"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ocr_worker*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["ocr_engine", "ocr_engine.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]