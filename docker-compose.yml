# ─────────────────────────────────────────────────────────────
# CatLium EduTech - Docker Compose configuration (single file)
# ─────────────────────────────────────────────────────────────
#
# Runs the full stack in ONE command: backing infrastructure
# (Postgres/Redis/RabbitMQ), the application (API, web, OCR service,
# DB migrations, both async workers — material + AI generation, and
# the OmniRoute AI gateway), the internal nginx reverse proxy, and
# the Cloudflare Tunnel (cloudflared).
#
# PUBLIC BOUNDARY
#   NOTHING is published to the host by this file. The Cloudflare
#   Tunnel (cloudflared) is the ONLY public ingress:
#
#     Cloudflare edge -> cloudflared -> http://nginx:80 -> web:3001 / api:3000
#
#   nginx is the only application-facing reverse proxy and routes:
#     /        -> web:3001   (Next.js app)
#     /api/    -> api:3000   (NestJS API, /api/v1 prefix preserved)
#   Postgres, Redis, RabbitMQ, OCR, workers, OmniRoute, nginx and the
#   API/web containers are INTERNAL, reachable only over the private
#   Docker network. Never add host ports for them in production.
#
#   For LOCAL DEVELOPMENT, `docker-compose.dev.yml` (an explicit
#   opt-in override) publishes the internal services plus api/web
#   bound to 127.0.0.1 only. Production deployments must NOT use it.
#
#   For a DETERMINISTIC DEMO (no external AI credentials), add
#   `-f docker-compose.demo.yml` — it runs an internal mock AI provider
#   and applies the demo seed. See docker-compose.demo.yml for details.
#
# Usage (from the repo root):
#   𝗣𝗿𝗼𝗱𝘂𝗰𝘁𝗶𝗼𝗻 (tunnel is the only public entry; requires TUNNEL_TOKEN +
#   the prod cookie posture in .env — see docs/architecture/cloudflare-tunnel.md):
#     docker compose up -d --build
#   𝗗𝗲𝘃  (loopback publishes for the browser + host tooling):
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#   𝗗𝗲𝗺𝗼 (layered on dev):
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#                    -f docker-compose.demo.yml up --build
#
# Registry-based roll (tagged images; only the 5 app services are pushed):
#     docker compose build
#     docker compose push api web worker-ai worker-material ocr
#     # on any host:  docker compose up -d
#
# The root `.env` is loaded into each app container (env_file). Settings
# that must point at container hostnames (postgres/rabbitmq/redis/ocr/
# omniroute) are overridden under each service's `environment` block so
# you don't have to rewrite your local `.env` URLs.
#
# Production hardening is baked in: restart policies, init, resource
# limits and json-file log rotation. Secrets come from the root `.env`
# (cp .env.example .env then override) — the `:-` defaults are dev-only
# and MUST NOT reach production.

x-prod-common: &prod-common-ts
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: '20m'
      max-file: '5'

services:
  # ── Backing infrastructure (INTERNAL) ──────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: catlium-postgres
    # No host port mapping: reachable only via the Docker network.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catlium_dev}
      POSTGRES_USER: ${POSTGRES_USER:-catlium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catlium_dev_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-catlium} -d ${POSTGRES_DB:-catlium_dev}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: catlium-redis
    # No host port mapping.
    volumes:
      - redis_data:/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: catlium-rabbitmq
    # No host port mapping (management UI included).
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-catlium}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-catlium_dev_secret}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # Heartbeat = 1800 so long AI jobs (which block the worker's pika
      # connection thread for minutes) never get killed and requeued in a
      # re-run loop. Workers must request the same value in their URL.
      - ./infrastructure/compose/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ── Database migrations (one-shot) ─────────────────────────
  migrate:
    build:
      context: .
      dockerfile: infrastructure/compose/Dockerfile.api
    working_dir: /app/packages/database
    command: ['node_modules/.bin/drizzle-kit', 'migrate']
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-catlium}:${POSTGRES_PASSWORD:-catlium_dev_secret}@postgres:5432/${POSTGRES_DB:-catlium_dev}
    depends_on:
      postgres:
        condition: service_healthy

  # ── Application (INTERNAL — reached only via nginx) ────────
  api:
    <<: *prod-common-ts
    build:
      context: .
      dockerfile: infrastructure/compose/Dockerfile.api
    image: ${IMAGE_PREFIX:-catlium}/api:${VERSION:-latest}
    container_name: catlium-api
    # No host port mapping — nginx proxies /api/ -> api:3000.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-catlium}:${POSTGRES_PASSWORD:-catlium_dev_secret}@postgres:5432/${POSTGRES_DB:-catlium_dev}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-catlium}:${RABBITMQ_PASSWORD:-catlium_dev_secret}@rabbitmq:5672?heartbeat=1800
      STORAGE_LOCAL_DIR: /storage
      OCR_SERVICE_URL: http://ocr:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    volumes:
      - storage_data:/storage
    mem_limit: 1g
    cpus: 2.0
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://localhost:3000/api/v1/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Public client-facing web app (Next.js). It talks to the API via RELATIVE
  # /api/v1 (same origin) — nginx routes /api/* -> api:3000 — so nothing is
  # baked at build time and the image works unchanged for dev and public hosts.
  web:
    <<: *prod-common-ts
    build:
      context: .
      dockerfile: infrastructure/compose/Dockerfile.api
    image: ${IMAGE_PREFIX:-catlium}/web:${VERSION:-latest}
    container_name: catlium-web
    working_dir: /app/apps/web
    command: ['node', 'node_modules/next/dist/bin/next', 'start', '-p', '3001']
    # No host port mapping — nginx proxies / -> web:3001.
    mem_limit: 1g
    cpus: 2.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://localhost:3001/login").then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Internal reverse proxy (nginx) ─────────────────────────
  # The ONLY application-facing reverse proxy and the single target for
  # the Cloudflare Tunnel. Binds only inside the private network — no
  # host port. Routes /api/ -> api:3000 and everything else -> web:3001.
  nginx:
    build:
      context: infrastructure/nginx
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-catlium}/nginx:${VERSION:-latest}
    container_name: catlium-nginx
    restart: unless-stopped
    init: true
    # No host port mapping: reached only by cloudflared over the network.
    mem_limit: 128m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  # ── Cloudflare Tunnel (ONLY public ingress) ────────────────
  # Remote-managed mode: the token embeds the tunnel credentials + secret,
  # so nothing secret is committed — set TUNNEL_TOKEN in the root .env.
  # all traffic: Cloudflare edge -> tunnel -> http://nginx:80
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: catlium-tunnel
    restart: unless-stopped
    init: true
    command: ['tunnel', '--no-autoupdate', 'run', '--token', '${TUNNEL_TOKEN}']
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    depends_on:
      nginx:
        condition: service_healthy

  # ── Internal AI gateway (OmniRoute) ────────────────────────
  # No local LLM ever: the AI worker only talks to this internal,
  # OpenAI-compatible gateway, never to a browser-facing endpoint.
  # Operator setup (one-time): create a provider + endpoint key in the
  # OmniRoute dashboard and set WORKER_AI_API_KEY in .env. The demo
  # override (docker-compose.demo.yml) bypasses this with a mock provider.
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: catlium-omniroute
    # No host port mapping: reachable only via the Docker network.
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    environment:
      PORT: '20128'
      # MUST be set in .env (see .env.example). Dev override supplies local
      # defaults bound to 127.0.0.1.
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:-}
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET:-}
    volumes:
      - omniroute_data:/app/data
    healthcheck:
      # 401 (auth required) proves the gateway is serving; only 5xx/crash = down.
      test: ['CMD-SHELL', 'node -e "fetch(\"http://localhost:20128/v1/models\").then(r=>process.exit(r.status>=500?1:0)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 10s
      retries: 10

  # ── Internal OCR service (local PaddleOCR) ─────────────────
  ocr:
    build:
      context: .
      dockerfile: infrastructure/compose/Dockerfile.python
    image: ${IMAGE_PREFIX:-catlium}/ocr:${VERSION:-latest}
    container_name: catlium-ocr
    command: ['uvicorn', 'app.main:app', '--host', '0.0.0.0', '--port', '8000']
    # No host port mapping.
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: 4.0
    env_file:
      - .env
    environment:
      OCR_HOST: 0.0.0.0
      OCR_PORT: 8000
      OCR_RELOAD: 'false'
      # Shared secret for the internal-auth header convention
      # (`x-internal-api-key`). Empty in local dev; MUST be set in
      # production so only workers can call /extract.
      OCR_INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
    volumes:
      # Persist the PaddleOCR model cache so downloads survive rebuilds.
      - paddle_models:/root/.paddlex
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request as u; u.urlopen("http://localhost:8000/health", timeout=5)']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  worker-material:
    build:
      context: .
      dockerfile: infrastructure/compose/Dockerfile.python
    image: ${IMAGE_PREFIX:-catlium}/worker-material:${VERSION:-latest}
    container_name: catlium-worker-material
    command: ['python', '-m', 'worker.app']
    restart: on-failure:10
    init: true
    mem_limit: 2g
    cpus: 4.0
    env_file:
      - .env
    environment:
      WORKER_ROLE: material
      WORKER_RABBITMQ_URL: amqp://${RABBITMQ_USER:-catlium}:${RABBITMQ_PASSWORD:-catlium_dev_secret}@rabbitmq:5672?heartbeat=1800
      WORKER_DATABASE_URL: postgresql://${POSTGRES_USER:-catlium}:${POSTGRES_PASSWORD:-catlium_dev_secret}@postgres:5432/${POSTGRES_DB:-catlium_dev}
      WORKER_OCR_URL: http://ocr:8000
      WORKER_INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      WORKER_STORAGE_DIR: /storage
    volumes:
      - storage_data:/storage
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      ocr:
        condition: service_healthy

  # AI generation worker. AI goes ONLY through the internal OmniRoute
  # gateway (OpenAI-compatible /v1). No local LLM (no Ollama/llama.cpp)
  # and no direct-to-provider browser calls. WORKER_AI_PROVIDER_URL may
  # still be overridden to any OpenAI-compatible endpoint and
  # WORKER_AI_API_KEY to the matching credential.
  worker-ai:
    build:
      context: .
      dockerfile: infrastructure/compose/Dockerfile.python
    image: ${IMAGE_PREFIX:-catlium}/worker-ai:${VERSION:-latest}
    container_name: catlium-worker-ai
    command: ['python', '-m', 'worker.app']
    restart: on-failure:10
    init: true
    mem_limit: 1g
    cpus: 2.0
    env_file:
      - .env
    environment:
      WORKER_ROLE: ai
      WORKER_RABBITMQ_URL: amqp://${RABBITMQ_USER:-catlium}:${RABBITMQ_PASSWORD:-catlium_dev_secret}@rabbitmq:5672?heartbeat=1800
      WORKER_DATABASE_URL: postgresql://${POSTGRES_USER:-catlium}:${POSTGRES_PASSWORD:-catlium_dev_secret}@postgres:5432/${POSTGRES_DB:-catlium_dev}
      WORKER_STORAGE_DIR: /storage
      # Containerized worker reaches the internal OmniRoute gateway by name
      # (never by the browser/host address). Host-based dev sets its own
      # WORKER_AI_PROVIDER_URL (127.0.0.1:20128) outside compose.
      WORKER_AI_PROVIDER_URL: http://omniroute:20128/v1
      # Independent jobs run in parallel up to this many worker threads
      # (each its own RabbitMQ connection, prefetch 1).
      WORKER_AI_CONCURRENCY: ${WORKER_AI_CONCURRENCY:-5}
      # OmniRoute endpoint key (issued in the OmniRoute dashboard). Sent
      # to the gateway as `Authorization: Bearer <key>`.
      WORKER_AI_API_KEY: ${WORKER_AI_API_KEY:-}
    volumes:
      - storage_data:/storage
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '5'
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      omniroute:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  storage_data:
  omniroute_data:
  paddle_models: