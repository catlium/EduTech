# ─────────────────────────────────────────────────────────────
# CatLium EduTech - DEVELOPMENT-ONLY Docker Compose override
# ─────────────────────────────────────────────────────────────
#
# OPT-IN local-development convenience: the single docker-compose.yml
# publishes NOTHING to the host (the Cloudflare Tunnel is the only public
# ingress). For local work this override re-publishes ONLY:
#   - nginx on 127.0.0.1:8080 — the single app entry you browse
#     (http://localhost:8080); nginx routes / -> web:3001 and /api/* -> api:3000
#   - the INTERNAL services (postgres, redis, rabbitmq, ocr, omniroute) on
#     127.0.0.1 for host-based tooling (drizzle studio, psql, redis-cli, OCR/AI
#     workers run outside Docker, E2E suites).
#
# The web app and API are NOT published separately — nginx is their only
# entry, and the client calls relative /api/v1 (same origin), so a single
# unbaked web image serves both http://localhost:8080 and the public tunnel.
#
# ⚠️  THIS FILE MUST NEVER BE USED IN PRODUCTION. The base compose file
#     exposes nothing to the host; this override opens loopback ports for
#     local debugging only. Loopback binding keeps these unreachable from
#     other machines.
#
# Usage (from the repo root, compose at root):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   # browse http://localhost:8080 (web + api through nginx)

services:
  nginx:
    ports:
      - '127.0.0.1:${NGINX_PORT:-8080}:80'
    restart: 'no'

  # web/api get NO dev port publishes (nginx is their only entry); dev only
  # stops their auto-restart so local iteration doesn't fight a crash-loop.
  api:
    restart: 'no'

  web:
    restart: 'no'

  postgres:
    ports:
      - '127.0.0.1:5432:5432'
    restart: 'no'

  redis:
    ports:
      - '127.0.0.1:6379:6379'
    restart: 'no'

  rabbitmq:
    ports:
      - '127.0.0.1:5672:5672'
      - '127.0.0.1:15672:15672'
    restart: 'no'

  ocr:
    ports:
      - '127.0.0.1:8000:8000'
    restart: 'no'

  omniroute:
    ports:
      - '127.0.0.1:20128:20128'
    restart: 'no'
    environment:
      # Dev defaults bound to loopback only; real .env values win.
      # Production must never use the fallbacks (base file only).
      INITIAL_PASSWORD: ${OMNIROUTE_INITIAL_PASSWORD:-omniroute-dev-password}
      JWT_SECRET: ${OMNIROUTE_JWT_SECRET:-dev-only-insecure-secret-change-me}

  worker-material:
    restart: 'no'

  worker-ai:
    restart: 'no'

  # Dev has no TUNNEL_TOKEN → cloudflared has nothing valid to run (it exits
  # immediately instead of crash-looping). The tunnel is a PRODUCTION ingress;
  # dev reaches web/api on loopback and does not need it.
  tunnel:
    restart: 'no'

  # Distributed OCR worker for local validation — the SAME standalone image an
  # external machine runs (infrastructure/compose/Dockerfile.ocr-worker),
  # pointed at the dev API over the private network.
  #
  # Bootstrap: register a worker once (admin UI or POST /ocr/workers → returns
  # {workerId, apiKey} only once), put those in .env as WORKER_OCR_WORKER_ID /
  # WORKER_OCR_API_KEY, then `docker compose ... up ocr-worker`. Without them
  # the worker exits at boot (required config).
  ocr-worker:
    build:
      context: .
      dockerfile: infrastructure/compose/Dockerfile.ocr-worker
    container_name: catlium-ocr-worker
    env_file:
      - .env
    environment:
      # Dev uses the private network (http + container name); external
      # production workers use https://<public-host>/api/v1 instead.
      WORKER_OCR_SERVER_URL: http://api:3000/api/v1
      WORKER_OCR_WORKER_ID: ${WORKER_OCR_WORKER_ID:-}
      WORKER_OCR_API_KEY: ${WORKER_OCR_API_KEY:-}
    volumes:
      - paddle_models:/root/.paddlex
    depends_on:
      api:
        condition: service_healthy